openapi: 3.0.3
info:
  title: RiskLens API
  version: 1.0.0
paths:
  /api/v1/risk-assessments:
    post:
      summary: Calculate risk assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskAssessmentCreateRequestDto'
      responses:
        '201':
          description: Created

components:
  schemas:
    RiskAssessmentCreateRequestDto:
      type: object
      required:
        - portfolioId
      properties:
        portfolioId:
          type: string
          format: uuid
        riskMethod:
          type: string
